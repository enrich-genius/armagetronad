name: client

# Previews for pull requests, a published release for the default branch.
#
# This repository does not deploy production. The platform repo owns that, and
# consumes the release this workflow publishes -- so production has a single
# owner and a deploy always names an immutable artifact.
#
# This deploys the committed webbuild/dist rather than rebuilding: the project
# deliberately commits its build output, so dist is the artifact under review and
# CI should publish exactly what a reviewer looked at. Rebuilding here would also
# mean provisioning emsdk and cross-building libxml2 on every run.
#
# The consequence is that a change to src/ without a matching webbuild/build.sh
# run deploys the *old* client, so the staleness check below fails the build
# instead of shipping something that silently does not contain the change.

on:
  pull_request:
    branches: [release_0.2.9-wasm]
  push:
    branches: [release_0.2.9-wasm]

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create releases on the default branch
      pull-requests: write   # comment the preview URL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the build is present
        run: |
          test -f webbuild/dist/armagetronad.html || {
            echo "::error::No client build committed at webbuild/dist."
            exit 1
          }
          echo "version=$(grep -o 'assetVersion="[0-9]*"' webbuild/dist/armagetronad.html | head -1)"

      - name: Check the build is not stale
        run: |
          # If tracked sources changed more recently than the build output, the
          # committed dist does not contain them.
          src_commit=$(git log -1 --format=%ct -- src webbuild/shell.html webbuild/build.sh webbuild/data)
          dist_commit=$(git log -1 --format=%ct -- webbuild/dist)
          if [ "${src_commit:-0}" -gt "${dist_commit:-0}" ]; then
            echo "::error::Sources changed after the last committed build."
            echo "Run ./webbuild/build.sh and commit webbuild/dist."
            exit 1
          fi

      - name: Package the client artifact
        run: ./webbuild/package-dist.sh

      # Pull requests get an isolated preview under their own branch alias.
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler@4 pages deploy webbuild/dist \
            --project-name=armagetronad-wasm \
            --branch="pr-${{ github.event.pull_request.number }}" \
            --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const alias = 'https://pr-${{ github.event.pull_request.number }}.armagetronad-wasm.pages.dev';
            const body = [
              '**Preview deployed**',
              '',
              `- This build: ${url}/armagetronad`,
              `- Stable alias for this PR: ${alias}/armagetronad`,
              '',
              'Preview deployments are behind Cloudflare Access; sign in with your',
              'Cloudflare account to view. Hard-reload, the loader is versioned.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) =>
              c.user.type === 'Bot' && c.body.startsWith('**Preview deployed**'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      # The release is what the platform consumes, and what the GPL source offer
      # points at. Skipped when this version was already published.
      - name: Publish the client release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -o 'assetVersion="[0-9]*"' webbuild/dist/armagetronad.html | head -1 | grep -o '[0-9]*')
          tag="client-$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to publish."
            exit 0
          fi
          gh release create "$tag" build-artifacts/*.tar.gz build-artifacts/*.sha256 \
            --title "Client $version" \
            --notes "Browser client build \`$version\`, from source commit \`${{ github.sha }}\`.

          GPL-2.0-or-later. Corresponding source: this repository at \`${{ github.sha }}\`. See \`LICENSES.md\`."

      - name: Trigger production deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
        run: |
          version=$(grep -o 'assetVersion="[0-9]*"' webbuild/dist/armagetronad.html | head -1 | grep -o '[0-9]*')
          tag="client-$version"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing PLATFORM_DEPLOY_TOKEN. Add a token that can dispatch enrich-genius/armagetronad-platform workflows."
            exit 1
          fi
          gh workflow run deploy.yml \
            --repo enrich-genius/armagetronad-platform \
            --ref main \
            -f client_release="$tag"
