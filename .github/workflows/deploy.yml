name: Deploy WebAssembly build to Cloudflare Pages

on:
  push:
    branches: [release_0.2.9-wasm]
    paths:
      - "src/**"
      - "webbuild/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-pages-production
  cancel-in-progress: false

env:
  EMSCRIPTEN_VERSION: 6.0.2
  LIBXML2_VERSION: 2.12.10

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      # libxml2 takes a few minutes to cross-compile and changes only when the
      # version or the build script does, so cache it on exactly those inputs.
      - name: Cache wasm libxml2
        id: cache-libxml2
        uses: actions/cache@v4
        with:
          path: wasm-deps
          key: libxml2-${{ env.LIBXML2_VERSION }}-emsdk${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('webbuild/build-libxml2.sh') }}

      - name: Build libxml2 for wasm
        if: steps.cache-libxml2.outputs.cache-hit != 'true'
        run: ./webbuild/build-libxml2.sh
        env:
          WASM_DEPS_DIR: ${{ github.workspace }}/wasm-deps
          BUILD_DIR: ${{ runner.temp }}

      - name: Build the game
        run: ./webbuild/build.sh
        env:
          WASM_DEPS_DIR: ${{ github.workspace }}/wasm-deps

      - name: Verify build output
        run: |
          cd webbuild/dist
          for f in armagetronad.html armagetronad.js armagetronad.wasm armagetronad.data; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          ls -lh armagetronad.*

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.107.0"
          command: pages deploy webbuild/dist --project-name=armagetronad-wasm
