  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a12; color: #cfe; font-family: system-ui, sans-serif; }
    #wrap { position: fixed; inset: 0; }
    /* The canvas owns the entire viewport; every control floats above it. */
    #canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; background: #000; outline: none; }
    /* Startup takes a while after the download finishes -- emscripten's preload
       plugins decode every packaged image before main() runs -- so cover the
       black canvas with a splash for the whole wait rather than leaving a bare
       progress bar sitting at 100%. */
    #loading { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; background: #0a0a12; text-align: center; padding: 1rem; transition: opacity .4s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-size: clamp(1.1rem, 4.5vw, 1.9rem); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #8ddcff; text-shadow: 0 0 18px rgba(74,170,221,.55); }
    /* A light cycle tracing its trail around the ring. */
    #spinner { width: 3.4rem; height: 3.4rem; border-radius: 50%; border: 3px solid #1a2a3a; border-top-color: #4ad; border-right-color: #8ddcff; animation: spin 900ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #spinner { animation-duration: 2.4s; } }
    #status { font-size: .82rem; opacity: .75; min-height: 1.2em; }
    #progress { width: min(260px, 70vw); height: 4px; background: #1a1a2a; border-radius: 2px; overflow: hidden; }
    #progress > div { height: 100%; width: 0; background: #4ad; transition: width .2s; }
    button { font: inherit; padding: .25rem .8rem; border: 1px solid #345; border-radius: 4px; background: #1b2233; color: #cfe; cursor: pointer; }
    button:hover { background: #243049; }
    /* The bar carries only the floating controls; it never has a background. */
    #bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: block; pointer-events: none; font-size: .8rem; }
    /* Withheld until the splash is gone, so the two never overlap. */
    #github { display: none; color: #8ddcff; text-decoration: none; }
    #bar.ready #github { display: block; position: absolute; left: 50%; bottom: .45rem; transform: translateX(-50%); pointer-events: auto; opacity: .7; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
    #bar.ready #github:hover { opacity: 1; color: #cfe; text-decoration: underline; }
    #bar.ready #fs { position: absolute; right: .8rem; bottom: .45rem; pointer-events: auto; opacity: .7; }
    #bar.ready #fs:hover { opacity: 1; }
    #touch-controls { display: none; }
    @media (hover: none) and (pointer: coarse) {
      #fs { display: none; }
      /* Clear of the virtual control row that lines the bottom edge. */
      #bar.ready #github { top: .5rem; bottom: auto; }
      #touch-controls { position: absolute; inset: 0; z-index: 1; display: block; pointer-events: none; touch-action: none; }
      /* Lifted clear of the in-game HUD (speed, rubber and brake gauges) that
         the engine draws along the bottom edge. */
      .touch-button { position: absolute; bottom: max(4.75rem, calc(env(safe-area-inset-bottom) + 3.75rem)); width: 4.5rem; height: 4.5rem; border: 2px solid rgba(170,220,255,.65); border-radius: 50%; background: rgba(17,34,51,.72); color: #e8fbff; font: 700 1.8rem/1 system-ui, sans-serif; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
      .touch-button:active { background: rgba(60,112,150,.9); }
      #touch-left { left: max(1rem, env(safe-area-inset-left)); }
      #touch-right { left: max(6.25rem, calc(env(safe-area-inset-left) + 5.25rem)); }
      #touch-brake { right: max(1rem, env(safe-area-inset-right)); font-size: .75rem; }
      #touch-select { right: max(6.25rem, calc(env(safe-area-inset-right) + 5.25rem)); font-size: .72rem; }
      /* Escape: opens the in-game menu, and backs out of menus. */
      #touch-menu { position: absolute; top: max(.5rem, env(safe-area-inset-top)); left: max(.5rem, env(safe-area-inset-left)); pointer-events: auto; touch-action: none; opacity: .75; font-size: .72rem; padding: .3rem .7rem; }
    }
    #touch-menu { display: none; }
    @media (hover: none) and (pointer: coarse) { #touch-menu { display: block; } }
    /* In fullscreen the canvas is the only thing on screen. */
    #wrap:fullscreen #bar { display: none; }

<body>
  <div id="wrap">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="touch-controls" aria-label="Touch controls">
      <button id="touch-left" class="touch-button" aria-label="Turn left">←</button>
      <button id="touch-right" class="touch-button" aria-label="Turn right">→</button>
      <button id="touch-select" class="touch-button" aria-label="Select menu item">SELECT</button>
      <button id="touch-brake" class="touch-button" aria-label="Brake">BRAKE</button>
      <button id="touch-menu" aria-label="Menu">MENU</button>
    </div>
    <div id="loading">
      <h1>Armagetron Advanced</h1>
      <div id="spinner" role="progressbar" aria-label="Loading"></div>
      <div id="status">Loading…</div>
      <div id="progress"><div id="progress-bar"></div></div>
    </div>
    <div id="bar">
      <a id="github" href="https://github.com/enrich-genius/armagetronad" target="_blank" rel="noopener noreferrer">GitHub</a>
      <button id="fs">Fullscreen</button>
    </div>
  </div>
  <script>
    var loadingEl = document.getElementById('loading');
    var peakDependencies = 0;
    function hideSplash() {
      if (loadingEl.classList.contains('done')) return;
      loadingEl.classList.add('done');
      // Leave it in the layer until the fade finishes, then stop compositing it.
      setTimeout(function () { loadingEl.style.display = 'none'; }, 500);
    }
    var statusEl = document.getElementById('status');
    var barEl = document.getElementById('progress-bar');
    var toolbarEl = document.getElementById('bar');
    var canvas = document.getElementById('canvas');
    var wrap = document.getElementById('wrap');
    // Replaced by build.sh. Keep the generated JS, wasm, and data package on
    // one cache generation: mixing an old loader with a new wasm binary makes
    // WebAssembly instantiation fail with missing imports.
    var assetVersion = '__BUILD_VERSION__';

    // Size the canvas *backing store*, not just its CSS box. Emscripten's SDL
    // reports these dimensions as the desktop resolution, and the game adopts
    // them for its video mode -- a canvas left at the 300x150 default (or at 0)
    // yields a degenerate surface and a black screen.
    function sizeCanvas() {
      var dpr = window.devicePixelRatio || 1;
      var w = Math.max(640, Math.floor(canvas.clientWidth * dpr));
      var h = Math.max(480, Math.floor(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }
    // Must happen before the module starts so the first video mode is sane.
    canvas.width = Math.max(640, window.innerWidth);
    canvas.height = Math.max(480, window.innerHeight);

    // Belt-and-suspenders for the opaque-context fix in rScreen.cpp: force every
    // WebGL context on this canvas to be created without an alpha channel. An
    // alpha context composites the canvas over the (black) page using the
    // framebuffer alpha, which the game never writes -- leaving the whole screen
    // transparent-black regardless of what was rendered.
    (function () {
      var orig = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (type && type.indexOf('webgl') === 0) {
          // alpha:false -> opaque compositing (see above).
          // preserveDrawingBuffer:true -> the finished frame is retained in the
          // buffer, so the compositor always has it to present even if the
          // game's rAF-paced frame and the browser's composite fall out of step.
          attrs = Object.assign({}, attrs, { alpha: false, preserveDrawingBuffer: true });
        }
        return orig.call(this, type, attrs);
      };
    })();

    // Multiplayer transport. A browser has no UDP, but emscripten's SOCKFS
    // already emulates SOCK_DGRAM by tunnelling each peer over a WebSocket, so
    // the game's existing sendto/recvfrom reach a real dedicated server as soon
    // as they are pointed at a relay that unwraps the frames. Opt-in, so a
    // build with no relay configured behaves exactly as it did before.
    //
    // One relay endpoint serves one authorised destination for the session; the
    // browser never names a host itself. Server discovery is a platform API
    // concern, not the game's UDP master query, which cannot be routed this way.
    var relayUrl = new URLSearchParams(location.search).get('relay') || null;

    var Module = {
      canvas: canvas,
      websocket: relayUrl ? { url: relayUrl, subprotocol: 'binary' } : {},
      locateFile: function (path) { return path + '?v=' + assetVersion; },
      arguments: [],
      preRun: [function () {
        sizeCanvas();
        // Persistent, writable user directory backed by IndexedDB.
        try {
          FS.mkdir('/persist');
          FS.mount(IDBFS, {}, '/persist');
          Module.addRunDependency('idbfs-load');
          FS.syncfs(true, function () { Module.removeRunDependency('idbfs-load'); });
        } catch (e) { console.warn('IDBFS init failed', e); }
      }],
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      setStatus: function (t) {
        var ready = !t || t === 'Running';
        var m = t && t.match(/([\d.]+)\/([\d.]+)/);
        if (m) {
          var done = parseFloat(m[1]), total = parseFloat(m[2]);
          barEl.style.width = (100 * done / total) + '%';
          // The download finishing is not the end of the wait: emscripten still
          // has to decode every preloaded image before main() runs, which is
          // the bulk of it. Say so instead of freezing on a full bar.
          statusEl.textContent = done >= total ? 'Preparing game…' : t;
        } else {
          barEl.style.width = '100%';
          statusEl.textContent = ready ? 'Starting…' : t;
        }
        toolbarEl.classList.toggle('ready', ready);
        if (ready) hideSplash();
      },
      // Without this hook emscripten never reports the preload phase, so the
      // status text sat on a finished download for the whole image-decode wait.
      monitorRunDependencies: function (left) {
        if (left > peakDependencies) peakDependencies = left;
        if (left > 0 && peakDependencies > 0) {
          statusEl.textContent = 'Preparing game…';
          barEl.style.width = (100 * (peakDependencies - left) / peakDependencies) + '%';
        }
      }
    };

    // Fullscreen the wrapper rather than the canvas, so the browser letterboxes
    // around it instead of stretching, and our own chrome hides via CSS.
    document.getElementById('fs').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (wrap.requestFullscreen) wrap.requestFullscreen();
      canvas.focus();
    });

    // Writing the config only puts it in the in-memory FS; this is what moves
    // it into IndexedDB so it survives a reload.
    function persist() {
      try { FS.syncfs(false, function () {}); } catch (e) {}
    }
    // 'pagehide' rather than the deprecated unload events; it also fires when
    // the tab is merely backgrounded, so settings survive being swapped out.
    window.addEventListener('pagehide', persist);
    // A phone can lose the tab without ever firing pagehide, so also flush on
    // the way to the background and on a slow timer.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') persist();
    });
    setInterval(persist, 10000);
    canvas.addEventListener('click', function () { canvas.focus(); });

    // Menus swap their contents under a resting finger, so a menu activation
    // only counts once per cooldown and only after a real lift. Steering is
    // deliberately exempt: it needs continuous press-and-hold.
    var MENU_TAP_COOLDOWN_MS = 350;
    var lastMenuTapAt = 0;
    function menuTapAllowed() {
      var now = Date.now();
      if (now - lastMenuTapAt < MENU_TAP_COOLDOWN_MS) return false;
      lastMenuTapAt = now;
      return true;
    }

    // SDL 1 maps the legacy DOM key codes below to its cursor/return keys.
    // Pointer events give each virtual button proper press-and-hold semantics,
    // so a player can steer or brake continuously instead of only tapping.
    function sendVirtualKey(type, key, code, keyCode) {
      var event = new Event(type, { bubbles: true, cancelable: true });
      Object.defineProperties(event, {
        key: { value: key }, code: { value: code }, keyCode: { value: keyCode },
        which: { value: keyCode }, charCode: { value: 0 }, location: { value: 0 },
        repeat: { value: false }, ctrlKey: { value: false }, shiftKey: { value: false },
        altKey: { value: false }, metaKey: { value: false }
      });
      canvas.dispatchEvent(event);
    }
    function bindTouchKey(id, key, code, keyCode, throttle) {
      var button = document.getElementById(id);
      var pressed = false;
      function release(event) {
        if (!pressed) return;
        pressed = false;
        sendVirtualKey('keyup', key, code, keyCode);
        if (event) event.preventDefault();
      }
      button.addEventListener('pointerdown', function (event) {
        event.preventDefault();
        if (pressed) return;
        if (throttle && !menuTapAllowed()) return;
        pressed = true;
        button.setPointerCapture(event.pointerId);
        canvas.focus();
        sendVirtualKey('keydown', key, code, keyCode);
      });
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', release);
    }
    bindTouchKey('touch-left', 'ArrowLeft', 'ArrowLeft', 37);
    bindTouchKey('touch-right', 'ArrowRight', 'ArrowRight', 39);
    bindTouchKey('touch-brake', 'ArrowDown', 'ArrowDown', 40);
    bindTouchKey('touch-select', 'Enter', 'Enter', 13, true);
    bindTouchKey('touch-menu', 'Escape', 'Escape', 27, true);

    // SDL 1 receives mouse events, not touch events. Convert a canvas tap to
    // one mouse-down event; uMenu uses it to select the tapped row (or accept
    // the currently selected row). Preventing the native compatibility click
    // avoids a double activation on mobile browsers.
    //
    // The tap is emitted on release, and only for a pointer that went down on
    // the canvas in the first place, so a finger already resting on the screen
    // when a new menu appears cannot activate whatever lands under it.
    // Dragging sideways steers, which beats hunting for a button mid-round. The
    // gesture is measured from a moving origin so a long drag can fire several
    // turns, and a swipe cancels the tap that would otherwise land on release.
    var SWIPE_PX = 38;
    var tapPointerId = null;
    var swipeOriginX = 0, swipeOriginY = 0, swiped = false;

    canvas.addEventListener('pointerdown', function (event) {
      if (event.pointerType !== 'touch') return;
      event.preventDefault();
      // Ignore additional fingers while one is already down.
      if (tapPointerId !== null) return;
      tapPointerId = event.pointerId;
      swipeOriginX = event.clientX;
      swipeOriginY = event.clientY;
      swiped = false;
    });

    canvas.addEventListener('pointermove', function (event) {
      if (event.pointerType !== 'touch' || tapPointerId !== event.pointerId) return;
      var dx = event.clientX - swipeOriginX;
      var dy = event.clientY - swipeOriginY;
      if (Math.abs(dx) < SWIPE_PX || Math.abs(dx) <= Math.abs(dy)) return;
      event.preventDefault();
      swiped = true;
      var right = dx > 0;
      sendVirtualKey('keydown', right ? 'ArrowRight' : 'ArrowLeft',
                     right ? 'ArrowRight' : 'ArrowLeft', right ? 39 : 37);
      sendVirtualKey('keyup', right ? 'ArrowRight' : 'ArrowLeft',
                     right ? 'ArrowRight' : 'ArrowLeft', right ? 39 : 37);
      // Re-anchor so continuing the drag can turn again.
      swipeOriginX = event.clientX;
      swipeOriginY = event.clientY;
    });

    function endCanvasTap(event) {
      if (event.pointerType !== 'touch' || tapPointerId !== event.pointerId) return;
      tapPointerId = null;
      event.preventDefault();
      if (swiped || event.type !== 'pointerup' || !menuTapAllowed()) return;
      canvas.dispatchEvent(new MouseEvent('mousedown', {
        bubbles: true, cancelable: true, button: 0, buttons: 1,
        clientX: event.clientX, clientY: event.clientY
      }));
    }
    canvas.addEventListener('pointerup', endCanvasTap);
    canvas.addEventListener('pointercancel', endCanvasTap);

    canvas.focus();
  </script>

</body>
